name: Probe truck tags

on:
  workflow_dispatch:          # run it by hand from the Actions tab

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count OSM truck tags per country (read-only)
        run: python probe_truck_tags.py
