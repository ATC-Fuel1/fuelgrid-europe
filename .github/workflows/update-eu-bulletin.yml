name: Update EU bulletin

on:
  schedule:
    - cron: "0 5 * * 1"      # every Monday 05:00 UTC (before the 06:00 price refresh)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-bulletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch latest EU bulletin
        run: python fetch_eu_bulletin.py

      - name: Commit if the bulletin changed
        run: |
          git config user.name "fuelgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/manual/eu_wob_prices.xlsx
          git commit -m "EU bulletin auto-update" || echo "No change this week"
          git pull --rebase --autostash || true
          git push || echo "Nothing to push"
